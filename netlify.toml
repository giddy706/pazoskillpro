[build]
  base = "frontend"
  publish = "public"
  command = ""

[build.environment]
  NODE_VERSION = "18"

# Proxy API requests to the deployed backend.
# Replace https://your-backend-url.com with your actual backend deployment URL.
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-url.com/api/:splat"
  status = 200
  force = true
