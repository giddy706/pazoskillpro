<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - pazoskill</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="logo"><img src="images/logo.png" alt="pazoskill logo"><span>pazoskill</span></a>
        </div>
    </nav>

    <section class="section">
        <div class="container" style="max-width: 500px;">
            <div class="card">
                <div class="card-body" style="padding: 2rem;">
                    <h2 class="text-center">Create Your Account</h2>
                    <p class="text-center mb-4">Start your learning journey today</p>

                    <form id="registerForm">
                        <div class="form-group">
                            <label for="fullName" class="form-label">Full Name *</label>
                            <input type="text" id="fullName" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">Email Address *</label>
                            <input type="email" id="email" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">Password *</label>
                            <input type="password" id="password" class="form-input" required>
                            <p class="form-help">Minimum 6 characters</p>
                        </div>

                        <div class="form-group">
                            <label for="promoCode" class="form-label">Referral / Promo Code (optional)</label>
                            <input type="text" id="promoCode" class="form-input" placeholder="e.g. JOHN50" autocomplete="off">
                            <p class="form-help" id="promoHint">Have a referral code from a marketer or friend? Enter it here for a discount on your first course.</p>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">Confirm Password *</label>
                            <input type="password" id="confirmPassword" class="form-input" required>
                        </div>

                        <div class="form-group" style="display: flex; align-items: start; gap: 0.5rem; margin-bottom: 1.5rem;">
                            <input type="checkbox" id="agreeTerms" required style="margin-top: 0.25rem;">
                            <label for="agreeTerms" style="font-size: 0.875rem; color: var(--gray);">I have read and agree to the <a href="privacy-policy.html" target="_blank">Privacy & Refund Policy</a> *</label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-large btn-block">Create Account</button>
                    </form>

                    <p class="text-center mt-3">
                        Already have an account? <a href="login.html">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Prefill referral code from ?ref=JOHN50 (marketer share links)
        (function () {
            var ref = new URLSearchParams(window.location.search).get('ref');
            if (ref) {
                document.getElementById('promoCode').value = ref;
                document.getElementById('promoHint').textContent = 'Referral code from your marketer applied: ' + ref.toUpperCase();
            }
        })();

        // Live-validate the referral code as the user types
        var promoInput = document.getElementById('promoCode');
        var promoHint = document.getElementById('promoHint');
        var promoDebounce = null;
        promoInput.addEventListener('input', function () {
            clearTimeout(promoDebounce);
            var code = promoInput.value.trim();
            if (!code) {
                promoHint.textContent = 'Have a referral code from a marketer or friend? Enter it here for a discount on your first course.';
                promoHint.style.color = '';
                return;
            }
            promoHint.textContent = 'Checking code...';
            promoHint.style.color = '';
            promoDebounce = setTimeout(function () {
                fetch((window.API_BASE_URL || '') + '/api/affiliates/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (data.success) {
                            promoHint.textContent = 'Valid! You get ' + data.promo.discountLabel + ' on your first course.';
                            promoHint.style.color = '#16a34a';
                        } else {
                            promoHint.textContent = data.message || 'Invalid code';
                            promoHint.style.color = '#dc2626';
                        }
                    })
                    .catch(function () {
                        promoHint.textContent = 'Could not check code (offline). It will be verified at registration.';
                        promoHint.style.color = '';
                    });
            }, 400);
        });

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const promoCode = document.getElementById('promoCode').value.trim();

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            const result = await registerUser({ fullName, email, password, promo_code: promoCode || undefined });

            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                alert(result.message || 'Registration failed');
            }
        });
    </script>
</body>

</html>
