<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - SkillPath Academy</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="logo">SkillPath<span>Academy</span></a>
        </div>
    </nav>

    <section class="section">
        <div class="container" style="max-width: 800px;">
            <h1 class="text-center mb-4">Complete Your Enrollment</h1>

            <div class="grid grid-2" style="gap: 2rem;">
                <div>
                    <div class="card mb-3">
                        <div class="card-body">
                            <h3>Course Summary</h3>
                            <h4 id="courseName"></h4>
                            <p id="courseDuration"></p>
                            <hr>
                            <div class="form-group">
                                <label for="promoCode" class="form-label">Referral / Promo Code</label>
                                <div style="display: flex; gap: 0.5rem;">
                                    <input type="text" id="promoCode" class="form-input" placeholder="e.g. JOHN50" autocomplete="off">
                                    <button id="applyPromoBtn" class="btn btn-secondary" style="white-space: nowrap;">Apply</button>
                                </div>
                                <p class="form-help" id="promoHint"></p>
                            </div>
                            <div class="flex-between" id="discountRow" style="display: none;">
                                <strong>Discount:</strong>
                                <strong id="discountAmount" style="color: #16a34a;"></strong>
                            </div>
                            <hr>
                            <div class="flex-between">
                                <strong>Total:</strong>
                                <strong id="coursePrice"
                                    style="font-size: 1.5rem; color: var(--primary-color);"></strong>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="card">
                        <div class="card-body">
                            <div class="alert alert-info">
                                <p>Clicking Complete Payment will open a secure Paystack checkout window where you can pay via Card, Bank, or Mobile Money.</p>
                            </div>

                            <button id="payBtn" class="btn btn-primary btn-large btn-block">Complete Payment</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script>
        const user = getCurrentUser();
        if (!user) {
            window.location.href = 'login.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = parseInt(urlParams.get('courseId'));
        const refParam = urlParams.get('ref');

        let course = null;
        let appliedPromo = null;

        function formatKSH(n) {
            return 'KSH ' + (n || 0).toLocaleString();
        }

        function renderTotals() {
            const priceEl = document.getElementById('coursePrice');
            const discEl = document.getElementById('discountAmount');
            const discRow = document.getElementById('discountRow');
            const hintEl = document.getElementById('promoHint');
            if (appliedPromo) {
                discRow.style.display = 'flex';
                discEl.textContent = '-' + formatKSH(appliedPromo.discountAmount);
                priceEl.textContent = formatKSH(appliedPromo.paidAmount);
                hintEl.textContent = 'Applied ' + appliedPromo.code + ' (' + appliedPromo.discountLabel + ') — you get ' + formatKSH(appliedPromo.discountAmount) + ' off!';
                hintEl.style.color = '#16a34a';
            } else {
                discRow.style.display = 'none';
                priceEl.textContent = formatKSH(course ? course.price : 0);
                hintEl.textContent = '';
            }
        }

        async function initCheckout() {
            try {
                const res = await fetch((window.API_BASE_URL || '') + `/api/courses/${courseId}`);
                if (!res.ok) throw new Error('Fetch failed');
                const data = await res.json();
                if (data.success && data.course) {
                    course = data.course;
                    document.getElementById('courseName').textContent = course.title;
                    document.getElementById('courseDuration').textContent = course.duration;
                    if (refParam) {
                        document.getElementById('promoCode').value = refParam;
                        applyPromo();
                    } else {
                        renderTotals();
                    }
                } else {
                    alert('Course not found');
                    window.location.href = 'courses.html';
                }
            } catch (e) {
                console.error('Failed to load course details:', e);
                alert('Course not found');
                window.location.href = 'courses.html';
            }
        }
        initCheckout();

        async function applyPromo() {
            const code = document.getElementById('promoCode').value.trim();
            const hintEl = document.getElementById('promoHint');
            if (!code) { appliedPromo = null; renderTotals(); return; }
            hintEl.textContent = 'Checking code...';
            hintEl.style.color = '';
            try {
                const res = await fetch((window.API_BASE_URL || '') + '/api/affiliates/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, courseId: courseId })
                });
                const data = await res.json();
                if (data.success) {
                    const promo = data.promo;
                    const price = course ? course.price : 0;
                    const discountAmount = promo.discountType === 'fixed'
                        ? Math.min(promo.discountValue, price)
                        : Math.round((price * promo.discountValue) / 100);
                    appliedPromo = {
                        code: promo.code,
                        discountLabel: promo.discountLabel,
                        discountAmount: discountAmount,
                        paidAmount: Math.max(price - discountAmount, 0)
                    };
                } else {
                    appliedPromo = null;
                    hintEl.textContent = data.message || 'Invalid referral / promo code';
                    hintEl.style.color = '#dc2626';
                }
                renderTotals();
            } catch (e) {
                appliedPromo = null;
                hintEl.textContent = 'Could not check code. It will be verified at payment.';
                hintEl.style.color = '';
                renderTotals();
            }
        }

        document.getElementById('applyPromoBtn').addEventListener('click', applyPromo);

        let paystackPublicKey = null;

        // Fetch Paystack configuration
        async function loadPaystackConfig() {
            try {
                const res = await fetch((window.API_BASE_URL || '') + '/api/config/paystack');
                const data = await res.json();
                if (data.success) {
                    paystackPublicKey = data.publicKey;
                }
            } catch (err) {
                console.error("Failed to load Paystack config", err);
            }
        }
        loadPaystackConfig();

        // Process payment
        document.getElementById('payBtn').addEventListener('click', async function () {
            const btn = this;
            btn.disabled = true;
            btn.textContent = 'Processing...';

            const promoCode = appliedPromo ? appliedPromo.code : (document.getElementById('promoCode').value.trim() || null);
            const amountToPay = appliedPromo && appliedPromo.paidAmount != null ? appliedPromo.paidAmount : (course ? course.price : 0);

            if (amountToPay === 0) {
                // Free course or 100% discount, bypass Paystack
                const result = await enrollInCourse(courseId, promoCode, null);
                if (result.success) {
                    alert('Enrollment successful! You are now enrolled in the course.');
                    window.location.href = 'dashboard.html';
                } else {
                    alert(result.message);
                    btn.disabled = false;
                    btn.textContent = 'Complete Payment';
                }
                return;
            }

            if (!paystackPublicKey) {
                alert('Payment system configuration missing. Please try again later.');
                btn.disabled = false;
                btn.textContent = 'Complete Payment';
                return;
            }

            // Initialize Paystack
            const handler = PaystackPop.setup({
                key: paystackPublicKey,
                email: user.email,
                amount: amountToPay * 100, // Paystack expects amount in kobo/cents
                currency: 'KES',
                callback: async function (response) {
                    // Payment successful on frontend, verify with backend
                    const result = await enrollInCourse(courseId, promoCode, response.reference);
                    if (result.success) {
                        alert('Payment verified and enrollment successful!');
                        window.location.href = 'dashboard.html';
                    } else {
                        alert('Payment verification failed: ' + result.message);
                        btn.disabled = false;
                        btn.textContent = 'Complete Payment';
                    }
                },
                onClose: function () {
                    alert('Payment cancelled.');
                    btn.disabled = false;
                    btn.textContent = 'Complete Payment';
                }
            });
            handler.openIframe();
        });
    </script>
</body>

</html>
